# ZINZIN on GitHub: the tests on every push; the firmware (a release build) and its web installer, with m-bootloader,
# published on the repository's GitHub Pages (Settings > Pages > Source: GitHub Actions). Then everything happens in
# Chrome or Edge: https://<account>.github.io/<repository>/install/
# The firmware job fetches JieLi's toolchain (pkgman.jieliapp.com) and the three files of the AC79 SDK a package needs
# (cpu/wl82/tools, Apache-2.0), as fm1-base's README describes.
name: firmware
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  VERSION: "0.1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow fonttools
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            build/host_out/*.png
            build/host_out/*.gif
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: pip install pillow
      - name: JieLi toolchain
        run: |
          sh base/tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: AC79 SDK (the package's three files only)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK "$HOME/fw-AC79_AIoT_SDK"
          git -C "$HOME/fw-AC79_AIoT_SDK" sparse-checkout set cpu/wl82/tools
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: ZINZIN
        run: cd base && python3 tools/build.py ../zinzin --release "$VERSION"
      - name: The installer
        run: |
          python3 tools/make_installer.py zinzin/build/*-"$VERSION".fwsc "$VERSION" site
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=install/"><a href="install/">ZINZIN</a>\n' > site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: zinzin-fwsc
          path: zinzin/build/*.fwsc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}install/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
