# Copyright (C) 2026 Yoann
# ZINZIN on GitHub: the tests on every push; the firmware (a release build) and its web installer, with m-bootloader,
# and ZINZIN in the browser (fm1-base's emulator, with ZINZIN's own page for phones), published on the repository's
# GitHub Pages (Settings > Pages > Source: GitHub Actions): https://<account>.github.io/<repository>/ (jouer/ to play,
# install/ to install, from Chrome or Edge).
# The firmware job fetches JieLi's toolchain (pkgman.jieliapp.com) and the three files of the AC79 SDK a package needs
# (cpu/wl82/tools, Apache-2.0), as fm1-base's README describes.
name: firmware
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  VERSION: "0.2"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow fonttools
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            build/host_out/*.png
            build/host_out/*.gif
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: pip install pillow
      - name: JieLi toolchain
        run: |
          sh base/tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: AC79 SDK (the package's three files, as in AC79NN_SDK_V1.2.1, the version fm1-base was tested with)
        shell: bash
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK"
          git clone -q --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK "$SDK"
          cd "$SDK"
          git sparse-checkout set --no-cone cpu/wl82/tools/uboot.boot cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin
          want=4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4
          found=""
          for ref in $(git log --all --format=%H -- cpu/wl82/tools/uboot.boot); do
            git checkout -q "$ref" 2>/dev/null || continue
            if [ "$(sha256sum cpu/wl82/tools/uboot.boot | cut -d' ' -f1)" = "$want" ]; then found="$ref"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error title=sdk::no commit with V1.2.1's uboot.boot. Tags: $(git tag -l | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=sdk::AC79 SDK files from $found ($(git log -1 --format='%ad %s' "$found" | head -c 120))"
          sha256sum cpu/wl82/tools/uboot.boot cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin
          echo "AC79_SDK=$SDK" >> "$GITHUB_ENV"
      - name: ZINZIN
        shell: bash
        run: |
          set -o pipefail
          (cd base && python3 tools/build.py ../zinzin --release "$VERSION") 2>&1 | tee build.log || {
            # the end of the build's output as an annotation (readable from the API without the log files)
            tail -n 120 build.log | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::error title=build::' + t)"
            exit 1; }
          # what the build says about sizes and RAM, and any compiler warning in ZINZIN's own code
          tail -n 40 build.log | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::notice title=build::' + t)"
          { grep -E "zinzin/.*warning:" build.log || true; } | head -n 60 | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::notice title=warnings::' + (t or 'none'))"
      - name: The installer
        run: python3 tools/make_installer.py zinzin/build/*-"$VERSION".fwsc "$VERSION" site
      - uses: actions/upload-artifact@v4
        with:
          name: zinzin-fwsc
          path: zinzin/build/*.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: site-install
          path: site
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: pip install pillow
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: ZINZIN in the browser (fm1-base's emulator, ZINZIN's page)
        shell: bash
        run: |
          set -o pipefail
          (cd base && python3 tools/build.py ../zinzin --web --release "$VERSION") 2>&1 | tee web.log || {
            tail -n 120 web.log | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::error title=web::' + t)"
            exit 1; }
          rm -rf zinzin/build/emu/o2
          ls -la zinzin/build/emu
      - name: Checked in a phone-sized headless Chromium (it switches on, plays, moves, sounds)
        shell: bash
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          set -o pipefail
          node tools/web_smoke.js zinzin/build/emu . 2>&1 | tee smoke.log || { tail -n 40 smoke.log | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::error title=smoke::' + t)"; exit 1; }
          tail -n 40 smoke.log | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::notice title=smoke::' + t)"
      - uses: actions/upload-artifact@v4
        with:
          name: site-web
          path: zinzin/build/emu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke.png
          if-no-files-found: ignore
  site:
    needs: [firmware, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-install
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: site-web
          path: site/jouer
      - run: cp zinzin/web/index.html site/index.html && ls -R site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
